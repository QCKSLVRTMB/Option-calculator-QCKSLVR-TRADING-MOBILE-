<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<style>
  * {
    box-sizing: border-box;
    font-family: 'Segoe UI','Inter',system-ui,sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    overscroll-behavior: contain;
    touch-action: manipulation;
    overflow-x: hidden;
  }
  body {
    background: #eef2f5;
    margin: 0;
    padding: 6px;
    font-size: 13px;
    color: #1a3b4f;
  }
  .container { max-width: 1200px; margin: 0 auto; }

  h1 {
    font-size: clamp(1rem, 4.5vw, 1.25rem);
    font-weight: 600;
    margin: 0 0 .15rem;
    line-height: 1.22;
  }
  .sub {
    color: #4a6f8a;
    margin-bottom: 8px;
    border-left: 3px solid #2c7da0;
    padding-left: 8px;
    font-size: .72rem;
  }

  /* ============ Рыночная цена БА ============ */
  .market-panel {
    background: white;
    border-radius: 12px;
    padding: 8px 12px;
    margin-bottom: 8px;
    border: 1px solid #e2edf4;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .market-panel .label {
    font-size: .6rem;
    font-weight: 700;
    color: #2c506d;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .market-panel .value {
    font-size: clamp(1rem, 4vw, 1.25rem);
    font-weight: 800;
    color: #1e5a7a;
    line-height: 1.1;
  }
  .market-panel .source {
    font-size: .6rem;
    color: #7f9bb3;
    margin-left: auto;
    text-align: right;
    max-width: 45%;
  }

  /* ============ Панель модели ============ */
  .model-panel {
    background: white;
    border-radius: 12px;
    padding: 8px 12px;
    margin-bottom: 8px;
    border: 1px solid #e2edf4;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .model-panel label { margin: 0; font-size: .65rem; }
  .model-panel select { max-width: 100%; }
  .model-hint {
    font-size: .62rem;
    color: #5f7f9e;
    font-style: italic;
  }

  /* ============ Двухколоночная сетка (1 колонка на мобильном) ============ */
  .two-columns {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-bottom: 8px;
    align-items: start;
  }
  @media (min-width: 720px) {
    .two-columns { grid-template-columns: 1fr 1fr; gap: 12px; }
  }

  /* ============ Панель-спойлер ============ */
  .panel {
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 12px -6px rgba(0,0,0,.10);
    overflow: hidden;
    list-style: none;
  }
  .panel > summary { list-style: none; }
  .panel > summary::-webkit-details-marker { display: none; }
  .panel > summary::marker { display: none; }

  .panel-header {
    color: white;
    padding: 9px 12px;
    font-size: .78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: filter .15s;
  }
  .panel-header:active { filter: brightness(0.92); }
  .panel-buy .panel-header { background: #9c00ff; }
  .panel-sell .panel-header { background: #fb92f0; }

  .panel-header .chevron {
    display: inline-block;
    font-size: 1rem;
    line-height: 1;
    transform: rotate(180deg);
    transition: transform .2s ease;
    opacity: 0.95;
    margin-left: 8px;
  }
  .panel:not([open]) .panel-header .chevron { transform: rotate(0deg); }
  .panel:not([open]) .panel-body { display: none; }

  .panel-body { padding: 8px 10px; }

  /* ============ Формы ============ */
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 6px;
  }
  .form-row.single { grid-template-columns: 1fr; }
  @media (max-width: 380px) {
    .form-row { grid-template-columns: 1fr; }
  }
  .form-group { min-width: 0; }

  label {
    font-size: .58rem;
    text-transform: uppercase;
    font-weight: 700;
    color: #2c506d;
    margin-bottom: 2px;
    display: block;
    letter-spacing: .02em;
  }

  input, select, button {
    width: 100%;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid #cfdfe9;
    background: #fff;
    font-size: 16px;
    min-height: 36px;
    -webkit-appearance: none;
    appearance: none;
  }
  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3l4 4 4-4' stroke='%234a6f8a' stroke-width='1.5' fill='none'/></svg>");
    background-repeat: no-repeat;
    background-position: right 8px center;
    padding-right: 22px;
  }
  button {
    background: #1e5a7a;
    color: white;
    font-weight: 600;
    border: none;
    cursor: pointer;
    font-size: 14px;
    min-height: 36px;
    transition: background .15s;
  }
  button:active { background: #0f425c; }
  button:hover { background: #0f425c; }
  .btn-secondary {
    background: #eef2f7;
    color: #1f3e54;
    border: 1px solid #cbdde8;
  }
  .btn-secondary:active,
  .btn-secondary:hover { background: #dbe7f0; }

  input.input-error {
    color: #d32f2f !important;
    border-color: #d32f2f !important;
    background: #fdecec !important;
  }
  .validation-msg {
    color: #d32f2f;
    font-size: .65rem;
    margin: -3px 0 5px 0;
    display: none;
  }
  .validation-msg.show { display: block; }
  .expiry-source {
    font-size: .6rem;
    color: #2c7da0;
    margin-top: 1px;
    min-height: 10px;
  }
  .board-price-hint {
    font-size: .68rem;
    color: #1c5a7a;
    margin-top: 3px;
    font-weight: 700;
    min-height: 12px;
    font-family: Consolas, monospace;
  }
  #strikeBuy, #strikeSell { font-weight: 700; }

  /* ============ Блок результата ============ */
  .result-block {
    margin-top: 6px;
    border-radius: 10px;
    padding: 8px 10px;
    border: 1px solid #e2edf4;
  }
  .panel-buy .result-block { background: #f9f3ff; }
  .panel-sell .result-block { background: #fff3fe; }
  .price-value {
    font-size: clamp(1.05rem, 4.5vw, 1.35rem);
    font-weight: 700;
    line-height: 1.12;
  }
  .panel-buy .price-value { color: #5c0099; }
  .panel-sell .price-value { color: #a3139e; }
  .breakeven {
    margin-top: 4px;
    font-size: .7rem;
    color: #4a6f8a;
    background: #eef6fb;
    border-radius: 6px;
    padding: 3px 7px;
    display: inline-block;
  }
  .breakeven b { color: #1c5a7a; }
  .greeks {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin-top: 5px;
  }
  .greek {
    background: white;
    border-radius: 12px;
    padding: 2px 6px;
    border: 1px solid #dee9f0;
    font-size: .68rem;
    white-space: nowrap;
  }

  /* ============ Кнопки действий ============ */
  .buttons-row {
    display: flex;
    justify-content: center;
    margin-bottom: 8px;
  }
  .buttons-row button { max-width: 220px; }

  /* ============ Итоговая панель P&L ============ */
  .spread-panel {
    background: #f9fbfd;
    border-radius: 12px;
    padding: 10px 12px;
    border: 1px solid #e2edf4;
    margin-bottom: 8px;
  }
  .spread-panel .price-value { color: #1c5a7a; }
  .badge {
    background: #eef3fc;
    border-radius: 16px;
    padding: 2px 8px;
    font-size: .65rem;
    display: inline-block;
    margin-top: 4px;
    color: #1c5a7a;
  }
  .card-title {
    font-size: .88rem;
    font-weight: 600;
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 2px solid #e6edf4;
    color: #1a3b4f;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Калькулятор опционов QCKSLVR TRADING</h1>
  <div class="sub">https://vk.ru/qckslvrtrading</div>

  <!-- Рыночная цена БА -->
  <div id="marketPricePanel" class="market-panel" style="display:none;">
    <div>
      <div class="label">Рыночная цена БА (CLOSE D1)</div>
      <div class="value" id="marketPrice">— ₽</div>
    </div>
    <div class="source" id="marketPriceSource"></div>
  </div>

  <div class="model-panel">
    <div>
      <label>Модель расчёта</label>
      <select id="pricingModel">
        <option value="bs">Black‑Scholes (европейский)</option>
        <option value="binom">Биномиальная (американский)</option>
      </select>
    </div>
    <div class="model-hint">
      BS — для европейских; биномиальная — для американских.
    </div>
  </div>

  <div class="two-columns">
    <!-- ============ ПОКУПКА ============ -->
    <details class="panel panel-buy" open>
      <summary class="panel-header">
        <span>Уровень покупок</span>
        <span class="chevron">▾</span>
      </summary>
      <div class="panel-body">
        <div class="form-row">
          <div class="form-group"><label>Тип</label>
            <select id="optionTypeBuy"><option value="call">Call</option><option value="put">Put</option></select></div>
          <div class="form-group"><label>Страйк</label>
            <select id="strikeBuy"><option value="0">Загрузка…</option></select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Уровень (цена БА)</label>
            <input type="number" id="priceBuy" value="0" step="0.1" inputmode="decimal"></div>
          <div class="form-group"><label>Дата</label>
            <input type="date" id="currentDateBuy"></div>
        </div>
        <div class="validation-msg" id="dateValidationBuy">Дата изменена</div>
        <div class="form-row single">
          <div class="form-group"><label>Дата исполнения</label>
            <input type="date" id="expiryDateBuy">
            <div class="expiry-source" id="expirySourceBuy"></div>
            <div class="board-price-hint" id="boardPriceHintBuy"></div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Ставка %</label>
            <input type="number" id="riskFreeBuy" value="0" step="0.0001" inputmode="decimal"></div>
          <div class="form-group"><label>Волатильность %</label>
            <input type="number" id="volatilityBuy" value="30" step="0.1" inputmode="decimal"></div>
        </div>
        <div class="form-row single">
          <div class="form-group"><label>Дивиденды %</label>
            <input type="number" id="dividendBuy" value="0" step="0.0001" inputmode="decimal"></div>
        </div>
        <div class="result-block">
          <div class="price-value" id="priceBuyResult">— ₽</div>
          <div class="breakeven">ТБ: <b id="beBuy">— ₽</b></div>
          <div class="greeks" id="greeksBuy"></div>
        </div>
      </div>
    </details>

    <!-- ============ ПРОДАЖА ============ -->
    <details class="panel panel-sell" open>
      <summary class="panel-header">
        <span>Уровень продаж</span>
        <span class="chevron">▾</span>
      </summary>
      <div class="panel-body">
        <div class="form-row">
          <div class="form-group"><label>Тип</label>
            <select id="optionTypeSell"><option value="call">Call</option><option value="put">Put</option></select></div>
          <div class="form-group"><label>Страйк</label>
            <select id="strikeSell"><option value="0">Загрузка…</option></select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Уровень (цена БА)</label>
            <input type="number" id="priceSell" value="0" step="0.1" inputmode="decimal"></div>
          <div class="form-group"><label>Дата</label>
            <input type="date" id="currentDateSell"></div>
        </div>
        <div class="validation-msg" id="dateValidationSell">Дата изменена</div>
        <div class="form-row single">
          <div class="form-group"><label>Дата исполнения</label>
            <input type="date" id="expiryDateSell">
            <div class="expiry-source" id="expirySourceSell"></div>
            <div class="board-price-hint" id="boardPriceHintSell"></div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Ставка %</label>
            <input type="number" id="riskFreeSell" value="0" step="0.0001" inputmode="decimal"></div>
          <div class="form-group"><label>Волатильность %</label>
            <input type="number" id="volatilitySell" value="30" step="0.1" inputmode="decimal"></div>
        </div>
        <div class="form-row single">
          <div class="form-group"><label>Дивиденды %</label>
            <input type="number" id="dividendSell" value="0" step="0.0001" inputmode="decimal"></div>
        </div>
        <div class="result-block">
          <div class="price-value" id="priceSellResult">— ₽</div>
          <div class="breakeven">ТБ: <b id="beSell">— ₽</b></div>
          <div class="greeks" id="greeksSell"></div>
        </div>
      </div>
    </details>
  </div>

  <div class="buttons-row">
    <button id="resetBtn" class="btn-secondary">↺ Сброс полей</button>
  </div>

  <div class="spread-panel">
    <div class="card-title">Прибыль / Убыток</div>
    <div class="price-value" id="spreadResult">— ₽</div>
    <div id="recommendMsg" class="badge"></div>
  </div>
</div>

<script>
  // ============================================================
  // INJECTION — данные приходят из Python как JSON
  // ============================================================
  const __INJECT__ = /*__INJECT_PLACEHOLDER__*/{};

  const COLOR_ATM = '#1e88e5';
  const COLOR_ITM = '#2e7d32';
  const COLOR_OTM = '#d32f2f';
  const COLOR_NEUTRAL = '#333333';

  function normCDF(x){
    const t=1/(1+0.2316419*Math.abs(x));
    const d=0.3989423*Math.exp(-x*x/2);
    const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
    return x>0?1-p:p;
  }
  function blackScholes(spot,strike,T,rate,vol,div,type){
    if(T<=0||!isFinite(spot)||!isFinite(strike)||strike<=0||vol<=0)
      return (type==='call'?Math.max(0,spot-strike):Math.max(0,strike-spot));
    const r=rate/100,q=div/100,sigma=vol/100;
    const d1=(Math.log(spot/strike)+(r-q+sigma*sigma/2)*T)/(sigma*Math.sqrt(T));
    const d2=d1-sigma*Math.sqrt(T);
    if(type==='call') return spot*Math.exp(-q*T)*normCDF(d1)-strike*Math.exp(-r*T)*normCDF(d2);
    return strike*Math.exp(-r*T)*normCDF(-d2)-spot*Math.exp(-q*T)*normCDF(-d1);
  }
  function binomialAmerican(spot,strike,T,rate,vol,div,type,steps=200){
    if(T<=0||!isFinite(spot)||!isFinite(strike)||strike<=0||vol<=0)
      return (type==='call'?Math.max(0,spot-strike):Math.max(0,strike-spot));
    const r=rate/100,q=div/100,sigma=vol/100;
    const dt=T/steps;
    const u=Math.exp(sigma*Math.sqrt(dt));
    const d=1/u;
    const p=(Math.exp((r-q)*dt)-d)/(u-d);
    const disc=Math.exp(-r*dt);
    const values=Array(steps+1);
    for(let i=0;i<=steps;i++){
      const sT=spot*Math.pow(u,steps-i)*Math.pow(d,i);
      values[i]=type==='call'?Math.max(0,sT-strike):Math.max(0,strike-sT);
    }
    for(let step=steps-1;step>=0;step--){
      for(let i=0;i<=step;i++){
        const hold=disc*(p*values[i]+(1-p)*values[i+1]);
        const nodeP=spot*Math.pow(u,step-i)*Math.pow(d,i);
        const exer=type==='call'?Math.max(0,nodeP-strike):Math.max(0,strike-nodeP);
        values[i]=Math.max(hold,exer);
      }
    }
    return values[0];
  }
  function calcGreeks(spot,strike,T,rate,vol,div,type){
    if(T<=1e-6||!isFinite(spot)||!isFinite(strike)||strike<=0||vol<=0)
      return{delta:'—',gamma:'—',theta:'—',vega:'—'};
    const r=rate/100,q=div/100,sigma=vol/100;
    const sqrtT=Math.sqrt(T);
    const d1=(Math.log(spot/strike)+(r-q+sigma*sigma/2)*T)/(sigma*sqrtT);
    const d2=d1-sigma*sqrtT;
    const nd1=normCDF(d1);
    const pdf=Math.exp(-d1*d1/2)/Math.sqrt(2*Math.PI);
    const delta=type==='call'?Math.exp(-q*T)*nd1:Math.exp(-q*T)*(nd1-1);
    const gamma=pdf*Math.exp(-q*T)/(spot*sigma*sqrtT);
    const vega=spot*pdf*Math.exp(-q*T)*sqrtT/100;
    const thetaCall=-spot*pdf*sigma*Math.exp(-q*T)/(2*sqrtT)-r*strike*Math.exp(-r*T)*normCDF(d2)+q*spot*Math.exp(-q*T)*nd1;
    const thetaPut =-spot*pdf*sigma*Math.exp(-q*T)/(2*sqrtT)+r*strike*Math.exp(-r*T)*normCDF(-d2)-q*spot*Math.exp(-q*T)*normCDF(-d1);
    const theta=(type==='call'?thetaCall:thetaPut)/365;
    return{delta:delta.toFixed(3),gamma:gamma.toFixed(3),vega:vega.toFixed(2),theta:theta.toFixed(3)};
  }
  function getTimeYears(now,exp){
    if(!now||!exp) return 0;
    const t = (new Date(exp)-new Date(now))/(1000*3600*24*365);
    return t>0?t:0;
  }

  let __strikeList = [];
  let __centralStrike = null;
  let __initialized = false;

  function getIVForStrike(k) {
    const item = __strikeList.find(x => String(x.strike) === String(k));
    return item ? item.iv : null;
  }
  function classifyStrike(strike, central, optionType) {
    if (central == null) return { label: '', color: COLOR_NEUTRAL };
    const k = parseFloat(strike);
    const c = parseFloat(central);
    if (isNaN(k) || isNaN(c)) return { label: '', color: COLOR_NEUTRAL };
    if (k === c) return { label: 'ATM', color: COLOR_ATM };
    const isCall = optionType === 'call';
    const inTheMoney = isCall ? (k < c) : (k > c);
    return inTheMoney ? { label: 'ITM', color: COLOR_ITM } : { label: 'OTM', color: COLOR_OTM };
  }
  function applySelectColor(sel) {
    if (!sel) return;
    const opt = sel.options[sel.selectedIndex];
    if (!opt) return;
    sel.style.color = opt.dataset.color || COLOR_NEUTRAL;
  }
  function renderStrikesFor(selectId, optionType) {
    const sel = document.getElementById(selectId);
    if (!sel) return;
    const prevVal = sel.value;
    sel.innerHTML = '';
    if (!__strikeList || !__strikeList.length) {
      const opt = document.createElement('option');
      opt.value = "0";
      opt.textContent = "Нет страйков";
      sel.appendChild(opt);
      return;
    }
    __strikeList.forEach(s => {
      const cls = classifyStrike(s.strike, __centralStrike, optionType);
      const opt = document.createElement('option');
      opt.value = s.strike;
      opt.textContent = s.strike;
      opt.style.color = cls.color;
      opt.dataset.color = cls.color;
      sel.appendChild(opt);
    });
    let target = null;
    if (prevVal && __strikeList.some(x => String(x.strike) === String(prevVal))) target = prevVal;
    else if (__centralStrike != null) target = __centralStrike;
    else if (__strikeList.length > 0) target = __strikeList[0].strike;
    if (target != null) sel.value = target;
    applySelectColor(sel);
  }
  function renderStrikes() {
    renderStrikesFor('strikeBuy', document.getElementById('optionTypeBuy').value);
    renderStrikesFor('strikeSell', document.getElementById('optionTypeSell').value);
  }

  function _fmtBoardPrice(optType, side, strike, price) {
    if (price == null || !isFinite(price) || price <= 0) return '—';
    const sign   = side === 'Buy' ? '+' : '-';
    const letter = optType === 'call' ? 'C' : 'P';
    const kStr   = Number.isInteger(Number(strike)) ? String(Number(strike)) : String(strike);
    const pStr   = Number(price).toFixed(4).replace('.', ',');
    return `${sign}${letter}${kStr} ${pStr}`;
  }

  function applyAlertStrike(suf) {
    const at = (__INJECT__ && __INJECT__.alert_targets) || null;
    if (!at) return;
    const typeEl = document.getElementById('optionType' + suf);
    const selEl  = document.getElementById('strike' + suf);
    if (!typeEl || !selEl) return;
    const optType = typeEl.value;
    const mapKey  = (suf === 'Buy') ? 'strikes_buy' : 'strikes_sell';
    const targets = at[mapKey] || {};
    const target  = targets[optType];
    if (target == null) return;
    const opt = Array.from(selEl.options).find(o => String(o.value) === String(target));
    if (opt) {
      selEl.value = String(target);
      applySelectColor(selEl);
    }
  }

  function renderBoardPriceHint(suf) {
    const at = (__INJECT__ && __INJECT__.alert_targets) || null;
    const hintEl = document.getElementById('boardPriceHint' + suf);
    if (!hintEl) return;
    if (!at) { hintEl.innerText = ''; return; }
    const typeEl = document.getElementById('optionType' + suf);
    const selEl  = document.getElementById('strike' + suf);
    if (!typeEl || !selEl) { hintEl.innerText = ''; return; }
    const optType = typeEl.value;
    const strike  = selEl.value;
    const mapKey  = (suf === 'Buy') ? 'prices_buy' : 'prices_sell';
    const prices  = (at[mapKey] || {})[optType] || {};
    const price   = prices[String(strike)];
    if (price == null) { hintEl.innerText = ''; return; }
    const side = suf === 'Buy' ? 'Buy' : 'Sell';
    hintEl.innerText = 'Цена из доски: '
      + _fmtBoardPrice(optType, side, strike, Number(price));
  }

  function validateDateField(fieldId, msgId) {
    const el = document.getElementById(fieldId);
    const msgEl = document.getElementById(msgId);
    if (!el || !msgEl) return true;
    const today = new Date().toISOString().slice(0, 10);
    const invalid = el.value !== today;
    if (invalid && el.value) { el.classList.add('input-error'); msgEl.classList.add('show'); }
    else { el.classList.remove('input-error'); msgEl.classList.remove('show'); }
    return !invalid;
  }
  function validateCurrentDates() {
    validateDateField('currentDateBuy', 'dateValidationBuy');
    validateDateField('currentDateSell', 'dateValidationSell');
  }

  let __syncTimeout = null;
  function syncToParent() {
    if (!__initialized) return;
    if (__syncTimeout) clearTimeout(__syncTimeout);
    __syncTimeout = setTimeout(() => {
      try {
        const get = id => document.getElementById(id)?.value || '';
        const params = {
          level_buy: parseFloat(get('priceBuy')) || 0,
          level_sell: parseFloat(get('priceSell')) || 0,
          rf_buy:  parseFloat(get('riskFreeBuy')) || 0,
          rf_sell: parseFloat(get('riskFreeSell')) || 0,
          vol_buy: parseFloat(get('volatilityBuy')) || 0,
          vol_sell: parseFloat(get('volatilitySell')) || 0,
          div_buy: parseFloat(get('dividendBuy')) || 0,
          div_sell: parseFloat(get('dividendSell')) || 0,
        };
        const pUrl = new URL(window.parent.location.href);
        let changed = false;
        for (const k in params) {
          if (pUrl.searchParams.get(k) !== String(params[k])) {
            pUrl.searchParams.set(k, String(params[k]));
            changed = true;
          }
        }
        if (changed) window.parent.history.replaceState({}, '', pUrl.toString());
      } catch (e) {}
    }, 600);
  }

  function updatePrices(){
    validateCurrentDates();
    const model = document.getElementById('pricingModel').value;

    const typeBuy = document.getElementById('optionTypeBuy').value;
    const KBuy = parseFloat(document.getElementById('strikeBuy').value);
    const SBuy = parseFloat(document.getElementById('priceBuy').value);
    const expBuy = document.getElementById('expiryDateBuy').value;
    const dateBuy = document.getElementById('currentDateBuy').value;
    const rBuy = parseFloat(document.getElementById('riskFreeBuy').value) || 0;
    const volBuy = parseFloat(document.getElementById('volatilityBuy').value) || 0;
    const divBuy = parseFloat(document.getElementById('dividendBuy').value) || 0;

    let priceBuy = NaN;
    if (expBuy && !isNaN(KBuy) && KBuy > 0 && !isNaN(SBuy) && SBuy > 0) {
      const T = getTimeYears(dateBuy, expBuy);
      priceBuy = (model === 'bs')
        ? blackScholes(SBuy, KBuy, T, rBuy, volBuy, divBuy, typeBuy)
        : binomialAmerican(SBuy, KBuy, T, rBuy, volBuy, divBuy, typeBuy);
    }
    document.getElementById('priceBuyResult').innerHTML =
      isFinite(priceBuy) ? priceBuy.toFixed(2) + ' ₽' : '— ₽';
    let beBuy = NaN;
    if (isFinite(priceBuy) && !isNaN(KBuy)) {
      beBuy = typeBuy === 'call' ? KBuy + priceBuy : KBuy - priceBuy;
    }
    document.getElementById('beBuy').innerText = isFinite(beBuy) ? beBuy.toFixed(2) + ' ₽' : '— ₽';

    const gB = (expBuy && !isNaN(KBuy) && KBuy > 0)
      ? calcGreeks(SBuy, KBuy, getTimeYears(dateBuy, expBuy), rBuy, volBuy, divBuy, typeBuy)
      : {delta:'—',gamma:'—',theta:'—',vega:'—'};
    document.getElementById('greeksBuy').innerHTML =
      `<div class="greek">Δ ${gB.delta}</div><div class="greek">Γ ${gB.gamma}</div>` +
      `<div class="greek">Θ ${gB.theta}</div><div class="greek">ν ${gB.vega}</div>`;

    const typeSell = document.getElementById('optionTypeSell').value;
    const KSell = parseFloat(document.getElementById('strikeSell').value);
    const SSell = parseFloat(document.getElementById('priceSell').value);
    const expSell = document.getElementById('expiryDateSell').value;
    const dateSell = document.getElementById('currentDateSell').value;
    const rSell = parseFloat(document.getElementById('riskFreeSell').value) || 0;
    const volSell = parseFloat(document.getElementById('volatilitySell').value) || 0;
    const divSell = parseFloat(document.getElementById('dividendSell').value) || 0;

    let priceSell = NaN;
    if (expSell && !isNaN(KSell) && KSell > 0 && !isNaN(SSell) && SSell > 0) {
      const T = getTimeYears(dateSell, expSell);
      priceSell = (model === 'bs')
        ? blackScholes(SSell, KSell, T, rSell, volSell, divSell, typeSell)
        : binomialAmerican(SSell, KSell, T, rSell, volSell, divSell, typeSell);
    }
    document.getElementById('priceSellResult').innerHTML =
      isFinite(priceSell) ? priceSell.toFixed(2) + ' ₽' : '— ₽';
    let beSell = NaN;
    if (isFinite(priceSell) && !isNaN(KSell)) {
      beSell = typeSell === 'call' ? KSell + priceSell : KSell - priceSell;
    }
    document.getElementById('beSell').innerText = isFinite(beSell) ? beSell.toFixed(2) + ' ₽' : '— ₽';

    const gS = (expSell && !isNaN(KSell) && KSell > 0)
      ? calcGreeks(SSell, KSell, getTimeYears(dateSell, expSell), rSell, volSell, divSell, typeSell)
      : {delta:'—',gamma:'—',theta:'—',vega:'—'};
    document.getElementById('greeksSell').innerHTML =
      `<div class="greek">Δ ${gS.delta}</div><div class="greek">Γ ${gS.gamma}</div>` +
      `<div class="greek">Θ ${gS.theta}</div><div class="greek">ν ${gS.vega}</div>`;

    const spread = (isFinite(priceSell) && isFinite(priceBuy)) ? priceSell - priceBuy : NaN;
    document.getElementById('spreadResult').innerHTML =
      isFinite(spread) ? spread.toFixed(2) + ' ₽' : '— ₽';
    const intrinsic = Math.max(0, (isFinite(SSell) && !isNaN(KSell)) ? SSell - KSell : 0);
    document.getElementById('recommendMsg').innerHTML = isFinite(priceSell)
      ? `Внутр. стоимость: ${intrinsic.toFixed(2)} ₽ · Спред: ${isFinite(spread) ? spread.toFixed(2) : '—'} ₽`
      : '';
  }

  function saveSettings(){
    const data = {
      model: document.getElementById('pricingModel').value,
      optionTypeBuy: document.getElementById('optionTypeBuy').value,
      priceBuy: document.getElementById('priceBuy').value,
      currentDateBuy: document.getElementById('currentDateBuy').value,
      riskFreeBuy: document.getElementById('riskFreeBuy').value,
      volatilityBuy: document.getElementById('volatilityBuy').value,
      dividendBuy: document.getElementById('dividendBuy').value,
      optionTypeSell: document.getElementById('optionTypeSell').value,
      priceSell: document.getElementById('priceSell').value,
      currentDateSell: document.getElementById('currentDateSell').value,
      riskFreeSell: document.getElementById('riskFreeSell').value,
      volatilitySell: document.getElementById('volatilitySell').value,
      dividendSell: document.getElementById('dividendSell').value,
    };
    try { localStorage.setItem('optionCalcSettings_v5', JSON.stringify(data)); } catch(e){}
  }
  function loadSettings(){
    let s = {};
    try { s = JSON.parse(localStorage.getItem('optionCalcSettings_v5') || '{}'); } catch(e){ s = {}; }
    for (const k in s) {
      const el = document.getElementById(k);
      if (el && s[k] !== undefined) el.value = s[k];
    }
  }

  // ---- Обработчики ----
  ['optionTypeBuy','optionTypeSell','priceBuy','priceSell',
   'currentDateBuy','currentDateSell','expiryDateBuy','expiryDateSell',
   'riskFreeBuy','riskFreeSell','volatilityBuy','volatilitySell',
   'dividendBuy','dividendSell','pricingModel'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', () => { updatePrices(); saveSettings(); });
  });
  ['priceBuy','priceSell','riskFreeBuy','riskFreeSell',
   'volatilityBuy','volatilitySell','dividendBuy','dividendSell']
    .forEach(id => document.getElementById(id)?.addEventListener('input', syncToParent));

  ['expiryDateBuy','expiryDateSell'].forEach(id => {
    document.getElementById(id)?.addEventListener('change', function(){
      const suf = id.endsWith('Buy') ? 'Buy' : 'Sell';
      const srcEl = document.getElementById('expirySource'+suf);
      if (srcEl) srcEl.innerText = 'введено вручную';
      updatePrices(); saveSettings();
    });
  });

  document.getElementById('optionTypeBuy').addEventListener('change', function(){
    renderStrikesFor('strikeBuy', this.value);
    applyAlertStrike('Buy');
    renderBoardPriceHint('Buy');
    updatePrices(); saveSettings();
  });
  document.getElementById('optionTypeSell').addEventListener('change', function(){
    renderStrikesFor('strikeSell', this.value);
    applyAlertStrike('Sell');
    renderBoardPriceHint('Sell');
    updatePrices(); saveSettings();
  });
  document.getElementById('strikeBuy').addEventListener('change', function(){
    applySelectColor(this);
    const iv = getIVForStrike(this.value);
    if (iv != null) document.getElementById('volatilityBuy').value = iv;
    renderBoardPriceHint('Buy');
    updatePrices(); saveSettings();
  });
  document.getElementById('strikeSell').addEventListener('change', function(){
    applySelectColor(this);
    const iv = getIVForStrike(this.value);
    if (iv != null) document.getElementById('volatilitySell').value = iv;
    renderBoardPriceHint('Sell');
    updatePrices(); saveSettings();
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    const today = new Date().toISOString().slice(0,10);
    const exp = new Date(Date.now()+30*86400000).toISOString().slice(0,10);
    document.getElementById('pricingModel').value = 'bs';
    ['Buy','Sell'].forEach(suf => {
      document.getElementById('optionType'+suf).value = 'call';
      document.getElementById('price'+suf).value = '0';
      document.getElementById('currentDate'+suf).value = today;
      document.getElementById('expiryDate'+suf).value = exp;
      document.getElementById('riskFree'+suf).value = '10';
      document.getElementById('volatility'+suf).value = '30';
      document.getElementById('dividend'+suf).value = '0';
      document.getElementById('expirySource'+suf).innerText = '';
      const hintEl = document.getElementById('boardPriceHint'+suf);
      if (hintEl) hintEl.innerText = '';
    });
    if (__strikeList.length) renderStrikes();
    updatePrices(); saveSettings(); syncToParent();
  });

  // ============================================================
  // ИНИЦИАЛИЗАЦИЯ
  // ============================================================
  (function initAll(){
    const today = new Date().toISOString().slice(0,10);
    const defaultExp = new Date(Date.now()+30*86400000).toISOString().slice(0,10);

    document.getElementById('currentDateBuy').value = today;
    document.getElementById('currentDateSell').value = today;
    document.getElementById('expiryDateBuy').value = defaultExp;
    document.getElementById('expiryDateSell').value = defaultExp;

    loadSettings();

    const inj = __INJECT__ || {};

    if (Array.isArray(inj.strikes) && inj.strikes.length) {
      __strikeList = inj.strikes.slice();
      __centralStrike = (inj.central_strike != null) ? inj.central_strike : null;
      renderStrikes();
    }

    if (inj.expiry && /^\d{4}-\d{2}-\d{2}$/.test(inj.expiry)) {
      ['expiryDateBuy','expiryDateSell'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = inj.expiry;
      });
      const srcTxt = inj.series_code ? `из MOEX: серия ${inj.series_code}` : 'из MOEX';
      ['expirySourceBuy','expirySourceSell'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerText = srcTxt;
      });
    }

    if (inj.rf_buy != null) {
      document.getElementById('riskFreeBuy').value = Number(inj.rf_buy).toFixed(4);
    }
    if (inj.rf_sell != null) {
      document.getElementById('riskFreeSell').value = Number(inj.rf_sell).toFixed(4);
    }
    if (inj.div_buy != null) {
      document.getElementById('dividendBuy').value = (Number(inj.div_buy) * 100).toFixed(4);
    }
    if (inj.div_sell != null) {
      document.getElementById('dividendSell').value = (Number(inj.div_sell) * 100).toFixed(4);
    }
    if (inj.vol_buy != null) {
      document.getElementById('volatilityBuy').value = Number(inj.vol_buy).toFixed(2);
    } else {
      document.getElementById('volatilityBuy').value = '30';
    }
    if (inj.vol_sell != null) {
      document.getElementById('volatilitySell').value = Number(inj.vol_sell).toFixed(2);
    } else {
      document.getElementById('volatilitySell').value = '30';
    }

    if (inj.alert_targets) {
      const at = inj.alert_targets;
      if (at.lvl_buy != null) {
        document.getElementById('priceBuy').value = Number(at.lvl_buy).toFixed(2);
      }
      if (at.lvl_sell != null) {
        document.getElementById('priceSell').value = Number(at.lvl_sell).toFixed(2);
      }
      applyAlertStrike('Buy');
      applyAlertStrike('Sell');
      renderBoardPriceHint('Buy');
      renderBoardPriceHint('Sell');
    } else if (inj.alerts) {
      if (inj.alerts.buy != null) {
        document.getElementById('priceBuy').value = Number(inj.alerts.buy).toFixed(2);
      }
      if (inj.alerts.sell != null) {
        document.getElementById('priceSell').value = Number(inj.alerts.sell).toFixed(2);
      }
    }

    if (inj.market_price != null) {
      const _mp = Number(inj.market_price);
      document.getElementById('marketPrice').innerText = _mp.toFixed(2) + ' ₽';
      document.getElementById('marketPriceSource').innerText =
        'CLOSE D1 (MOEX ISS)';
      document.getElementById('marketPricePanel').style.display = 'flex';
    }

    document.getElementById('currentDateBuy').value = today;
    document.getElementById('currentDateSell').value = today;

    updatePrices();
    saveSettings();
    __initialized = true;
    syncToParent();
  })();
</script>
